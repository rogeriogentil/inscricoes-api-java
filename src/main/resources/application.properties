quarkus.datasource.db-kind=h2
quarkus.hibernate-orm.schema-management.strategy=update

# Testes: H2 em memória
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:inscricoes;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Dev/prod: H2 em arquivo (os dados sobrevivem a reinicializações)
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/inscricoes
%prod.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/inscricoes
